services:
  banco-dados:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  banco-dados-teste:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: oficina_teste
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina_teste"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  aplicacao:
    build:
      context: .
      target: runtime
    environment:
      PORTA: 3000
      URL_BANCO_DADOS: postgresql://postgres:postgres@banco-dados:5432/oficina?schema=public
    depends_on:
      migracao:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

  migracao:
    build:
      context: .
      target: build
    command: npm run prisma:deploy
    environment:
      URL_BANCO_DADOS: postgresql://postgres:postgres@banco-dados:5432/oficina?schema=public
    depends_on:
      banco-dados:
        condition: service_healthy

volumes:
  postgres_data:
